<?xml version="1.0" encoding="UTF-8"?>
<!-- Tray status icon: unprotected. Deliberately not named "-symbolic" so the
     shell keeps the red fill instead of recolouring it to the theme
     foreground. Drawn on a 16px grid to stay legible at tray size. -->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
    <path d="M8 1.3 L13.6 3.3 V8.2 C13.6 11.3 11.2 13.7 8 14.7 C4.8 13.7 2.4 11.3 2.4 8.2 V3.3 Z"
          fill="#e01b24"/>
    <path d="M6.0 6.0 L10.0 10.0 M10.0 6.0 L6.0 10.0"
          fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round"/>
</svg>
