[package]
name = "neutron"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Fast, lightweight WireGuard manager via NetworkManager"

[workspace]
members = [
    ".",
    "xtask",
]

[features]
# qBittorrent port-forward synchronisation. Off by default: the integration
# drives a third-party Web API and has automatic paths that fire on every
# reconnect, and it has not been validated against a real qBittorrent instance.
# Build with `--features qbittorrent` to include it.
default = []
qbittorrent = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "6.0"
rand = "0.9"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zbus = "5"
