[book]
title = "Neutron Documentation"
authors = ["Neutron Team"]
description = "Technical documentation for Neutron - WireGuard manager via NetworkManager"
language = "en"
src = "docs"

[build]
build-dir = "public"

[output.html]
git-repository-url = "https://github.com/PandaBytez/neutron"
edit-url-template = "https://github.com/PandaBytez/neutron/edit/main/docs/{path}"
default-theme = "ayu"
preferred-dark-theme = "ayu"
site-url = "/neutron/"
