stages:
  - test
  - build

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .cargo/
    - target/

rustfmt:
  stage: test
  image: rust:alpine
  before_script:
    - apk add --no-cache musl-dev git
    - rustup component add rustfmt
  script:
    - cargo fmt --all -- --check

clippy:
  stage: test
  image: rust:alpine
  before_script:
    - apk add --no-cache musl-dev git
    - rustup component add clippy
  script:
    - cargo clippy --all-targets -- -D warnings

test:
  stage: test
  image: rust:alpine
  before_script:
    - apk add --no-cache musl-dev git
  script:
    - cargo test --all

build_musl:
  stage: build
  image: rust:alpine
  before_script:
    - apk add --no-cache musl-dev git
  script:
    - cargo build --release
    - cp target/release/neutron ./neutron-linux-x86_64
  artifacts:
    name: "neutron-static-binary"
    paths:
      - "neutron-linux-x86_64"
    expire_in: 1 week
