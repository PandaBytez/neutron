stages:
  - test
  - build
  - deploy

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .cargo/
    - target/

rustfmt:
  stage: test
  image: rust:alpine
  before_script:
    - apk add --no-cache musl-dev git
    - rustup component add rustfmt
  script:
    - cargo fmt --all -- --check

clippy:
  stage: test
  image: rust:alpine
  before_script:
    - apk add --no-cache musl-dev git
    - rustup component add clippy
  script:
    - cargo clippy --all-targets -- -D warnings
    # Optional features must stay lint-clean too, or they rot while disabled.
    - cargo clippy --all-targets --features qbittorrent -- -D warnings

test:
  stage: test
  image: rust:alpine
  before_script:
    - apk add --no-cache musl-dev git curl
  script:
    - cargo test --all
    - cargo test --all --features qbittorrent

# System tests: the real CliNmClient and FirewallClient against real
# NetworkManager and firewalld. These are what cover the gap that every leak in
# BUGS.md lived in -- a mock can prove our argument builders are self-consistent,
# but not that NetworkManager accepts, stores and reports back what we send.
#
# Needs a privileged container for CAP_NET_ADMIN (WireGuard links, netfilter).
# Netfilter and routing are per network namespace, so this is confined to the
# job's own container -- see testing/README.md for the isolation evidence.
system_tests:
  stage: test
  image: quay.io/podman/stable
  # Not all runners allow privileged containers; keep the pipeline informative
  # rather than blocked if this one does not.
  allow_failure: true
  before_script:
    - podman --version
  script:
    - ./testing/run-container-tests.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Demonstrates the open leaks documented in BUGS.md. Expected to fail until they
# are fixed, so it never blocks the pipeline -- its value is the rule evidence in
# the job log.
leak_report:
  stage: test
  image: quay.io/podman/stable
  allow_failure: true
  when: manual
  script:
    - ./testing/run-container-tests.sh --leaks

build_musl:
  stage: build
  image: rust:alpine
  before_script:
    - apk add --no-cache musl-dev git
  script:
    - cargo build --release
    - cp target/release/neutron ./neutron-linux-x86_64
  artifacts:
    name: "neutron-static-binary"
    paths:
      - "neutron-linux-x86_64"
    expire_in: 1 week

# Publish mdBook documentation to GitLab Pages
pages:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl tar gzip
    - curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /usr/local/bin
  script:
    - mdbook build
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
