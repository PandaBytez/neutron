stages:
  - test
  - build

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .cargo/
    - target/

rustfmt:
  stage: test
  image: rust:alpine
  before_script:
    - apk add --no-cache musl-dev git
    - rustup component add rustfmt
  script:
    - cargo fmt --all -- --check

clippy:
  stage: test
  image: rust:alpine
  before_script:
    - apk add --no-cache musl-dev git
    - rustup component add clippy
  script:
    - cargo clippy --all-targets -- -D warnings

test:
  stage: test
  image: rust:alpine
  before_script:
    - apk add --no-cache musl-dev git
  script:
    - cargo test --all

flatpak:
  stage: build
  image: 'quay.io/gnome_infrastructure/gnome-runtime-images:gnome-49'
  variables:
    MANIFEST_PATH: "flatpak/io.gitlab.zento_vpn_manager.zento.json"
    FLATPAK_MODULE: "zento"
    APP_ID: "io.gitlab.zento_vpn_manager.zento"
    BUNDLE: "zento.flatpak"
  script:
    - flatpak-builder --user --force-clean --repo=repo build-dir ${MANIFEST_PATH}
    - flatpak build-bundle repo ${BUNDLE} ${APP_ID}
  artifacts:
    name: "flatpak-bundle"
    paths:
      - ${BUNDLE}
    expire_in: 1 week
