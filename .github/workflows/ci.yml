name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Lint (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests (default features)
        run: cargo test --all
      - name: Run tests (all features)
        run: cargo test --all --all-features

  system-tests:
    name: System Tests (sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # `cargo test-system` is an xtask binary, so the runner needs a toolchain
      # even though the tests themselves are compiled inside the container.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The sandbox image is a Fedora base with dnf-installed daemons, so
      # rebuilding it is minutes of network work. Cache it as a tarball keyed on
      # everything baked into it; the entrypoint starts NM/firewalld, so editing
      # it must invalidate the key or CI would run a stale sandbox and go green.
      - uses: actions/cache@v4
        id: sandbox-image
        with:
          path: /tmp/neutron-sandbox.tar
          key: sandbox-${{ runner.os }}-${{ hashFiles('testing/Containerfile', 'testing/entrypoint.sh') }}
      - if: steps.sandbox-image.outputs.cache-hit != 'true'
        run: |
          podman build -t neutron-sandbox -f testing/Containerfile .
          podman save -o /tmp/neutron-sandbox.tar neutron-sandbox
      - if: steps.sandbox-image.outputs.cache-hit == 'true'
        run: podman load -i /tmp/neutron-sandbox.tar
      # No selector: this runs every ignored test in one container invocation,
      # which matters because `podman run --rm` discards CARGO_TARGET_DIR each
      # time. The leak guards ride along (they are #[ignore]d in
      # system_firewall.rs), so `cargo test-leaks` would only repeat them.
      - name: Run system tests in the disposable sandbox
        run: cargo test-system

  build:
    name: Build Static Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: neutron-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/neutron
