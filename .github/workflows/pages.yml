name: Deploy mdBook to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          set -euo pipefail
          asset_dir=$(mktemp -d)
          trap 'rm -rf "$asset_dir"' EXIT
          # Digest published by rust-lang/mdBook for release asset 272868230.
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz \
            -o "$asset_dir/mdbook.tar.gz"
          printf '%s  %s\n' c0b903f01dd8f4edc644372ad2b80b1fdddd12552d37b6a098657cbd8eddd768 "$asset_dir/mdbook.tar.gz" | sha256sum --check --strict
          tar -xzf "$asset_dir/mdbook.tar.gz" -C "$asset_dir" mdbook
          install -m 755 "$asset_dir/mdbook" /usr/local/bin/mdbook
      - name: Build mdBook
        run: |
          mdbook build
          touch public/.nojekyll
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
